name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://beacon:beacon@127.0.0.1:5432/beacon_test
      SECRET_KEY: ci-test-secret-key-0123456789
      TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
      TELEGRAM_BOT_USERNAME: ci_test_bot
      INITIAL_ORG_NAME: Example Org
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: Secret123!
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke test
        run: python tests/smoke_test.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t beacon:ci .
