<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Beacon{% endblock %}</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb;
        --up:#16a34a; --down:#dc2626; --unk:#9ca3af; --accent:#2563eb; }
* { box-sizing: border-box; }
body { margin:0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
       background:var(--bg); color:var(--text); }
header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px;
         display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; }
header nav { display:flex; gap:14px; }
header .spacer { flex:1; }
main { max-width:1100px; margin:24px auto; padding:0 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:20px; margin-bottom:20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
.grid .card { margin-bottom:0; }
.stat .num { font-size:26px; font-weight:700; }
.stat .label { color:var(--muted); font-size:13px; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
th { color:var(--muted); font-weight:600; font-size:13px; }
a { color:var(--accent); }
.badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
         font-weight:600; color:#fff; white-space:nowrap; }
.badge.up { background:var(--up); }
.badge.down { background:var(--down); }
.badge.unknown { background:var(--unk); }
.badge.paused { background:#6b7280; }
.btn { display:inline-block; padding:8px 14px; border-radius:6px; border:1px solid var(--line);
       background:#fff; color:var(--text); cursor:pointer; text-decoration:none; font:inherit; font-size:14px; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.danger { color:var(--down); }
form.inline { display:inline; margin:0; }
label { display:block; font-weight:600; font-size:13px; margin-bottom:4px; color:var(--muted); }
input[type=text], input[type=url], input[type=number], input[type=password], select {
  width:100%; padding:9px 10px; border:1px solid #d1d5db; border-radius:6px; font:inherit; background:#fff; }
.field { margin-bottom:14px; }
.errors { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; padding:10px 14px;
          border-radius:6px; margin-bottom:16px; }
.muted { color:var(--muted); }
.warn { color:var(--down); font-weight:600; }
.login { max-width:360px; margin:80px auto; }
.code { font-family: ui-monospace, Menlo, monospace; font-size:13px; word-break:break-all; }
</style>
</head>
<body>
{% if user %}
<header>
  <h1>Beacon</h1>
  <nav>
    <a href="/">Monitors</a>
    <a href="/contacts">Contacts</a>
    <a href="/team">Team</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted">{{ user.org_name }} · {{ user.username }}</span>
  <form class="inline" method="post" action="/logout"><button class="btn" type="submit">Log out</button></form>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
